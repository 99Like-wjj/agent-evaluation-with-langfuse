<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1020" viewBox="0 0 1440 1020" role="img"><title>Agent 评测，从任务需要出发</title><desc>不同方向需要不同证据，指标集合应随业务任务调整。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}</style>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356eb2"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#167f7d"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a87024"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#775a9c"/></marker><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#203848"/></marker><marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b7280"/></marker></defs>
<rect width="1440" height="1020" fill="#fbfcfc"/>
<text x="48" y="66" font-size="34" fill="#203848" text-anchor="start" font-weight="700">Agent 评测，从任务需要出发</text>
<text x="48" y="110" font-size="21" fill="#5b7280" text-anchor="start">不同方向需要不同证据，指标集合应随业务任务调整。</text>
<rect x="1240" y="36" width="150" height="40" rx="20" fill="#edf2f4" stroke="none" stroke-width="2"/>
<text x="1315" y="64" font-size="19" fill="#5b7280" text-anchor="middle">通用方法</text>
<line x1="48" x2="1392" y1="144" y2="144" stroke="#dce5e9"/>
<rect x="60" y="210" width="400" height="420" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="84" y="254" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">结果是否满足要求</text>
<text x="84" y="294" font-size="22" fill="#203848" text-anchor="start">任务完成与业务状态</text>
<text x="84" y="326" font-size="22" fill="#203848" text-anchor="start">事实、要点与指令</text>
<text x="84" y="358" font-size="22" fill="#203848" text-anchor="start">回答是否回应问题</text>
<text x="84" y="390" font-size="22" fill="#203848" text-anchor="start">文件及多模态产物</text>
<text x="84" y="422" font-size="22" fill="#203848" text-anchor="start">交互、澄清与交接</text>
<rect x="520" y="210" width="400" height="420" rx="15" fill="#fff" stroke="#167f7d" stroke-width="2"/>
<text x="544" y="254" font-size="25" fill="#167f7d" text-anchor="start" font-weight="700">过程是否可靠</text>
<text x="544" y="294" font-size="22" fill="#203848" text-anchor="start">工具选择和参数</text>
<text x="544" y="326" font-size="22" fill="#203848" text-anchor="start">是否正确使用工具返回</text>
<text x="544" y="358" font-size="22" fill="#203848" text-anchor="start">规划与必要步骤</text>
<text x="544" y="390" font-size="22" fill="#203848" text-anchor="start">检索和引用依据</text>
<text x="544" y="422" font-size="22" fill="#203848" text-anchor="start">多轮上下文与记忆</text>
<rect x="980" y="210" width="400" height="420" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="1004" y="254" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">边界和运行表现</text>
<text x="1004" y="294" font-size="22" fill="#203848" text-anchor="start">权限与未授权动作</text>
<text x="1004" y="326" font-size="22" fill="#203848" text-anchor="start">敏感信息与提示注入</text>
<text x="1004" y="358" font-size="22" fill="#203848" text-anchor="start">重复运行的一致性</text>
<text x="1004" y="390" font-size="22" fill="#203848" text-anchor="start">超时与故障恢复</text>
<text x="1004" y="422" font-size="22" fill="#203848" text-anchor="start">耗时、token 和成本</text>
<rect x="60" y="720" width="1320" height="180" rx="12" fill="#fff7e9" stroke="#e8d6b8" stroke-width="2"/>
<text x="80" y="754" font-size="21" fill="#a87024" text-anchor="start">项目初期优先采用：正确性、完整性、指令遵循、相关性，每项独立评价。</text>
<text x="80" y="785" font-size="21" fill="#a87024" text-anchor="start">这是起步范围；后续还需扩展工具、动作、状态、安全和效率等指标，并补齐相应证据。</text>
<text x="80" y="816" font-size="21" fill="#a87024" text-anchor="start">图中列出可选方向，不表示项目已经全部实现，也不要求每道题使用全部指标。</text>
<text x="48" y="998" font-size="17" fill="#5b7280" text-anchor="start">评价方向可以扩展；程序、模型和人工各自处理适合的问题。</text>
</svg>