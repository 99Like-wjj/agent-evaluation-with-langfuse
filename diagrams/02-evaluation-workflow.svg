<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1420" viewBox="0 0 1440 1420" role="img"><title>Skill 如何把资料变成评测资产</title><desc>AI 理解业务与证据；程序执行发布、保存进度并核对结构和归属。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}</style>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356eb2"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#167f7d"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a87024"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#775a9c"/></marker><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#203848"/></marker><marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b7280"/></marker></defs>
<rect width="1440" height="1420" fill="#fbfcfc"/>
<text x="48" y="66" font-size="34" fill="#203848" text-anchor="start" font-weight="700">Skill 如何把资料变成评测资产</text>
<text x="48" y="110" font-size="21" fill="#5b7280" text-anchor="start">AI 理解业务与证据；程序执行发布、保存进度并核对结构和归属。</text>
<rect x="1240" y="36" width="150" height="40" rx="20" fill="#edf2f4" stroke="none" stroke-width="2"/>
<text x="1315" y="64" font-size="19" fill="#5b7280" text-anchor="middle">现有流程</text>
<line x1="48" x2="1392" y1="144" y2="144" stroke="#dce5e9"/>
<rect x="60" y="210" width="380" height="180" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="84" y="254" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">1  来源准备</text>
<text x="84" y="294" font-size="22" fill="#203848" text-anchor="start">理解文档或表格</text>
<text x="84" y="326" font-size="22" fill="#203848" text-anchor="start">保留原题、参考、UID 和出处</text>
<text x="84" y="358" font-size="22" fill="#203848" text-anchor="start">形成 CaseSet</text>
<rect x="530" y="210" width="380" height="180" rx="15" fill="#fff" stroke="#167f7d" stroke-width="2"/>
<text x="554" y="254" font-size="25" fill="#167f7d" text-anchor="start" font-weight="700">2  实际响应采集</text>
<text x="554" y="294" font-size="22" fill="#203848" text-anchor="start">检查能力、影响与授权</text>
<text x="554" y="326" font-size="22" fill="#203848" text-anchor="start">逐题调用应用并保存结果</text>
<text x="554" y="358" font-size="22" fill="#203848" text-anchor="start">未知状态先对账</text>
<rect x="1000" y="210" width="380" height="180" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="1024" y="254" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">3  证据审阅与设计</text>
<text x="1024" y="294" font-size="22" fill="#203848" text-anchor="start">逐题判断材料是否够用</text>
<text x="1024" y="326" font-size="22" fill="#203848" text-anchor="start">分别设计初期四项评估器</text>
<text x="1024" y="358" font-size="22" fill="#203848" text-anchor="start">需要时补读或说明缺口</text>
<polyline points="440,300 530,300" fill="none" stroke="#167f7d" stroke-width="2.8" marker-end="url(#a1)" stroke-linejoin="round"/>
<rect x="441.0" y="261" width="88" height="27" rx="3" fill="#fbfcfc" stroke="none" stroke-width="2"/>
<text x="485" y="279" font-size="18" fill="#167f7d" text-anchor="middle">完整构建</text>
<polyline points="910,300 1000,300" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<rect x="60" y="565" width="380" height="190" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="84" y="609" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">独立发布 Dataset</text>
<text x="84" y="649" font-size="22" fill="#203848" text-anchor="start">只发布源样本并读回版本</text>
<text x="84" y="681" font-size="22" fill="#203848" text-anchor="start">不采集应用，不依赖模型</text>
<text x="84" y="713" font-size="22" fill="#203848" text-anchor="start">可以在此交付</text>
<polyline points="250,390 250,565" fill="none" stroke="#356eb2" stroke-width="2.8" marker-end="url(#a0)" stroke-linejoin="round"/>
<rect x="177.2" y="469" width="145.60000000000002" height="29" rx="3" fill="#fbfcfc" stroke="none" stroke-width="2"/>
<text x="250" y="489" font-size="20" fill="#356eb2" text-anchor="middle">Dataset-only</text>
<rect x="530" y="565" width="380" height="190" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="554" y="609" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">5  发布与读回</text>
<text x="554" y="649" font-size="22" fill="#203848" text-anchor="start">创建或复用源 Dataset</text>
<text x="554" y="681" font-size="22" fill="#203848" text-anchor="start">发布 Evaluator / Rule</text>
<text x="554" y="713" font-size="22" fill="#203848" text-anchor="start">固定定义、版本与绑定</text>
<rect x="1000" y="565" width="380" height="190" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="1024" y="609" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">4  模型与映射绑定</text>
<text x="1024" y="649" font-size="22" fill="#203848" text-anchor="start">解析项目中的指定模型</text>
<text x="1024" y="681" font-size="22" fill="#203848" text-anchor="start">核对正式可用的输入</text>
<text x="1024" y="713" font-size="22" fill="#203848" text-anchor="start">绑定不完整则保留设计</text>
<polyline points="1190,390 1190,565" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<polyline points="1000,660 910,660" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<rect x="530" y="900" width="380" height="175" rx="15" fill="#fff" stroke="#a87024" stroke-width="2"/>
<text x="554" y="944" font-size="25" fill="#a87024" text-anchor="start" font-weight="700">6  显式启动 Run</text>
<text x="554" y="984" font-size="22" fill="#203848" text-anchor="start">正式实验重新调用应用</text>
<text x="554" y="1016" font-size="22" fill="#203848" text-anchor="start">使用已发布配置</text>
<text x="554" y="1048" font-size="22" fill="#203848" text-anchor="start">build 不自动启动 Run</text>
<polyline points="720,755 720,900" fill="none" stroke="#a87024" stroke-width="2.8" marker-end="url(#a2)" stroke-linejoin="round"/>
<rect x="652.0" y="815" width="136" height="29" rx="3" fill="#fbfcfc" stroke="none" stroke-width="2"/>
<text x="720" y="835" font-size="20" fill="#a87024" text-anchor="middle">明确运行请求</text>
<rect x="1000" y="900" width="380" height="175" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="1024" y="944" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">7  收集与解释</text>
<text x="1024" y="984" font-size="22" fill="#203848" text-anchor="start">核对样本与指标覆盖</text>
<text x="1024" y="1016" font-size="22" fill="#203848" text-anchor="start">保留原生结果、错误和缺分</text>
<text x="1024" y="1048" font-size="22" fill="#203848" text-anchor="start">按本次目标交付</text>
<polyline points="910,985 1000,985" fill="none" stroke="#356eb2" stroke-width="2.8" marker-end="url(#a0)" stroke-linejoin="round"/>
<rect x="60" y="900" width="380" height="175" rx="12" fill="#fff7e9" stroke="#e8d6b8" stroke-width="2"/>
<text x="80" y="934" font-size="21" fill="#a87024" text-anchor="start">模型绑定未完成时，</text>
<text x="80" y="965" font-size="21" fill="#a87024" text-anchor="start">可按已有授权保留设计，</text>
<text x="80" y="996" font-size="21" fill="#a87024" text-anchor="start">并独立发布 Dataset。</text>
<rect x="60" y="1170" width="1320" height="145" rx="12" fill="#fff7e9" stroke="#e8d6b8" stroke-width="2"/>
<text x="80" y="1204" font-size="21" fill="#a87024" text-anchor="start">贯穿各阶段：同一运行账本、证据引用与版本记录。</text>
<text x="80" y="1235" font-size="21" fill="#a87024" text-anchor="start">采集成功项不重发；未知写入先对账；重试建立新尝试；共享 Rule 不自动覆盖。</text>
<text x="80" y="1266" font-size="21" fill="#a87024" text-anchor="start">当前 AI 会话负责设计与解释，正式裁判负责评分，程序不在本地补分。</text>
<text x="48" y="1398" font-size="17" fill="#5b7280" text-anchor="start">源 Dataset 与评价计划解耦；完整构建不要求先发布 Dataset，再采集应用。</text>
</svg>