<polyline points="1310,1115 425,1115" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round" stroke-dasharray="8 5"/>
<rect x="763.22" y="1082" width="208.56" height="28" rx="3" fill="#fbfcfc" stroke="none" stroke-width="2"/>
<text x="867.5" y="1101" font-size="19" fill="#775a9c" text-anchor="middle">评价完成后保存 Score</text>
<polyline points="130,1215 425,1215" fill="none" stroke="#356eb2" stroke-width="2.8" marker-end="url(#a0)" stroke-linejoin="round"/>
<rect x="179.11" y="1182" width="196.78" height="28" rx="3" fill="#fbfcfc" stroke="none" stroke-width="2"/>
<text x="277.5" y="1201" font-size="19" fill="#356eb2" text-anchor="middle">读取 / 对账本次结果</text>
<rect x="48" y="1300" width="1344" height="105" rx="12" fill="#fff7e9" stroke="#e8d6b8" stroke-width="2"/>
<text x="68" y="1332" font-size="21" fill="#a87024" text-anchor="start">SSE 完成、观测入库与评分完成分别检查。规则不保证等待所有子观测到齐。</text>
<text x="68" y="1363" font-size="21" fill="#a87024" text-anchor="start">首次读取时，实验可能尚未完成或仍有缺分。</text>
<text x="48" y="1438" font-size="17" fill="#5b7280" text-anchor="start">SDK 在任务生命周期中管理关联；图示不把返回与导出强制解释成同步入库顺序。</text>
</svg>