<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img"><title>Skill 中哪些工作交给 AI，哪些交给程序</title><desc>业务含义由当前 AI 会话理解，重复操作和进度保存由通用服务完成。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}</style>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356eb2"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#167f7d"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a87024"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#775a9c"/></marker><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#203848"/></marker><marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b7280"/></marker></defs>
<rect width="1440" height="1080" fill="#fbfcfc"/>
<text x="48" y="66" font-size="34" fill="#203848" text-anchor="start" font-weight="700">Skill 中哪些工作交给 AI，哪些交给程序</text>
<text x="48" y="108" font-size="21" fill="#5b7280" text-anchor="start">业务含义由当前 AI 会话理解，重复操作和进度保存由通用服务完成。</text>
<rect x="1240" y="36" width="150" height="40" rx="20" fill="#edf2f4" stroke="none" stroke-width="2"/>
<text x="1315" y="64" font-size="19" fill="#5b7280" text-anchor="middle">模块分工</text>
<line x1="48" x2="1392" y1="140" y2="140" stroke="#dce5e9"/>
<text x="250" y="215" font-size="27" fill="#203848" text-anchor="middle" font-weight="700">AI 会话</text>
<text x="720" y="215" font-size="27" fill="#203848" text-anchor="middle" font-weight="700">通用服务</text>
<text x="1190" y="215" font-size="27" fill="#203848" text-anchor="middle" font-weight="700">平台接口</text>
<rect x="60" y="270" width="380" height="150" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="84" y="314" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">理解原始资料</text>
<text x="84" y="354" font-size="22" fill="#203848" text-anchor="start">辨认问题、预期和范围</text>
<rect x="530" y="270" width="380" height="150" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="554" y="314" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">整理与发布测试集</text>
<text x="554" y="354" font-size="22" fill="#203848" text-anchor="start">保留原文、来源和样本版本</text>
<rect x="1000" y="270" width="380" height="150" rx="15" fill="#fff" stroke="#167f7d" stroke-width="2"/>
<text x="1024" y="314" font-size="25" fill="#167f7d" text-anchor="start" font-weight="700">Langfuse API</text>
<text x="1024" y="354" font-size="22" fill="#203848" text-anchor="start">测试集、评估器和结果</text>
<polyline points="440,345 530,345" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<polyline points="910,345 1000,345" fill="none" stroke="#167f7d" stroke-width="2.8" marker-end="url(#a1)" stroke-linejoin="round"/>
<rect x="60" y="500" width="380" height="150" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="84" y="544" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">设计评价规则</text>
<text x="84" y="584" font-size="22" fill="#203848" text-anchor="start">阅读真实响应，判断资料缺口</text>
<rect x="530" y="500" width="380" height="150" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="554" y="544" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">编译并读回配置</text>
<text x="554" y="584" font-size="22" fill="#203848" text-anchor="start">提示词、变量映射和模型绑定</text>
<rect x="1000" y="500" width="380" height="150" rx="15" fill="#fff" stroke="#167f7d" stroke-width="2"/>
<text x="1024" y="544" font-size="25" fill="#167f7d" text-anchor="start" font-weight="700">Web 会话</text>
<text x="1024" y="584" font-size="22" fill="#203848" text-anchor="start">远程实验配置与触发</text>
<polyline points="440,575 530,575" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<polyline points="910,575 1000,575" fill="none" stroke="#167f7d" stroke-width="2.8" marker-end="url(#a1)" stroke-linejoin="round"/>
<rect x="60" y="730" width="380" height="150" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="84" y="774" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">解释评价结果</text>
<text x="84" y="814" font-size="22" fill="#203848" text-anchor="start">对照任务，分析偏差和失败</text>
<rect x="530" y="730" width="380" height="150" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="554" y="774" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">执行、恢复和结果核对</text>
<text x="554" y="814" font-size="22" fill="#203848" text-anchor="start">记录尝试，关联指定运行结果</text>
<rect x="1000" y="730" width="380" height="150" rx="15" fill="#fff" stroke="#167f7d" stroke-width="2"/>
<text x="1024" y="774" font-size="25" fill="#167f7d" text-anchor="start" font-weight="700">应用适配器</text>
<text x="1024" y="814" font-size="22" fill="#203848" text-anchor="start">HTTP / SSE / 会话调用</text>
<polyline points="440,805 530,805" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<polyline points="910,805 1000,805" fill="none" stroke="#167f7d" stroke-width="2.8" marker-end="url(#a1)" stroke-linejoin="round"/>
<line x1="955" y1="345" x2="955" y2="805" stroke="#167f7d" stroke-width="2.8"/>
<circle cx="955" cy="345" r="4" fill="#167f7d"/>
<circle cx="955" cy="575" r="4" fill="#167f7d"/>
<circle cx="955" cy="805" r="4" fill="#167f7d"/>
<rect x="60" y="940" width="1320" height="80" rx="12" fill="#fff7e9" stroke="#e8d6b8" stroke-width="2"/>
<text x="80" y="972" font-size="21" fill="#a87024" text-anchor="start">贯穿各阶段保存：来源与版本、每次尝试、发布记录、运行关联和原始结果。恢复流程时据此判断下一步。</text>
<text x="48" y="1058" font-size="17" fill="#5b7280" text-anchor="start">现有模块的匿名说明；没有自动执行未授权操作或在本地补写成绩。</text>
</svg>