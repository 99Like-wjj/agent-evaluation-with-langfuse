<text x="1040" y="929" font-size="20" fill="#356eb2" text-anchor="middle">发布规则 / 读结果</text>
<text x="48" y="1058" font-size="17" fill="#5b7280" text-anchor="start">图中展示 Langfuse 接入；通用 OTel 的其他导出目的端仍取决于实际配置。</text>
