<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img"><title>同一道题，每次运行都有自己的结果</title><desc>用样本身份、运行身份和目标观测关联成绩，避免混入历史同名分数。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}</style>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356eb2"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#167f7d"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a87024"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#775a9c"/></marker><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#203848"/></marker><marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b7280"/></marker></defs>
<rect width="1440" height="1050" fill="#fbfcfc"/>
<text x="48" y="66" font-size="34" fill="#203848" text-anchor="start" font-weight="700">同一道题，每次运行都有自己的结果</text>
<text x="48" y="110" font-size="21" fill="#5b7280" text-anchor="start">用样本身份、运行身份和目标观测关联成绩，避免混入历史同名分数。</text>
<rect x="1240" y="36" width="150" height="40" rx="20" fill="#edf2f4" stroke="none" stroke-width="2"/>
<text x="1315" y="64" font-size="19" fill="#5b7280" text-anchor="middle">概念关系</text>
<line x1="48" x2="1392" y1="144" y2="144" stroke="#dce5e9"/>
<rect x="60" y="200" width="380" height="150" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="84" y="244" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">Dataset Item</text>
<text x="84" y="284" font-size="22" fill="#203848" text-anchor="start">原问题、参考与上下文</text>
<text x="84" y="316" font-size="22" fill="#203848" text-anchor="start">样本身份和版本</text>
<rect x="540" y="200" width="380" height="150" rx="15" fill="#fff" stroke="#a87024" stroke-width="2"/>
<text x="564" y="244" font-size="25" fill="#a87024" text-anchor="start" font-weight="700">Experiment / Run</text>
<text x="564" y="284" font-size="22" fill="#203848" text-anchor="start">本次应用配置</text>
<text x="564" y="316" font-size="22" fill="#203848" text-anchor="start">本次运行身份</text>
<rect x="1020" y="200" width="360" height="150" rx="15" fill="#fff" stroke="#a87024" stroke-width="2"/>
<text x="1044" y="244" font-size="25" fill="#a87024" text-anchor="start" font-weight="700">Run Item</text>
<text x="1044" y="284" font-size="22" fill="#203848" text-anchor="start">把样本连到本次执行</text>
<text x="1044" y="316" font-size="22" fill="#203848" text-anchor="start">保留目标关联</text>
<polyline points="440,275 540,275" fill="none" stroke="#a87024" stroke-width="2.8" marker-end="url(#a2)" stroke-linejoin="round"/>
<rect x="442.0" y="238" width="96" height="29" rx="3" fill="#fbfcfc" stroke="none" stroke-width="2"/>
<text x="490" y="258" font-size="20" fill="#a87024" text-anchor="middle">参加实验</text>
<polyline points="920,275 1020,275" fill="none" stroke="#a87024" stroke-width="2.8" marker-end="url(#a2)" stroke-linejoin="round"/>
<rect x="60" y="500" width="380" height="150" rx="15" fill="#fff" stroke="#167f7d" stroke-width="2"/>
<text x="84" y="544" font-size="25" fill="#167f7d" text-anchor="start" font-weight="700">Trace / Observation</text>
<text x="84" y="584" font-size="22" fill="#203848" text-anchor="start">本次应用实际执行</text>
<text x="84" y="616" font-size="22" fill="#203848" text-anchor="start">模型、工具与目标输出</text>
<rect x="540" y="500" width="380" height="150" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="564" y="544" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">Evaluator + Rule</text>
<text x="564" y="584" font-size="22" fill="#203848" text-anchor="start">评价方法、模型和输出</text>
<text x="564" y="616" font-size="22" fill="#203848" text-anchor="start">选择目标、映射与排程</text>
<rect x="1020" y="500" width="360" height="150" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="1044" y="544" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">Score</text>
<text x="1044" y="584" font-size="22" fill="#203848" text-anchor="start">指向被评目标</text>
<text x="1044" y="616" font-size="22" fill="#203848" text-anchor="start">保留原生值与可选说明</text>
<polyline points="1200,350 1200,420 250,420 250,500" fill="none" stroke="#167f7d" stroke-width="2.8" marker-end="url(#a1)" stroke-linejoin="round"/>
<rect x="652.0" y="383" width="136" height="29" rx="3" fill="#fbfcfc" stroke="none" stroke-width="2"/>
<text x="720" y="403" font-size="20" fill="#167f7d" text-anchor="middle">定位本次执行</text>
<polyline points="440,575 540,575" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<rect x="442.0" y="538" width="96" height="29" rx="3" fill="#fbfcfc" stroke="none" stroke-width="2"/>
<text x="490" y="558" font-size="20" fill="#775a9c" text-anchor="middle">可用材料</text>
<polyline points="920,575 1020,575" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<rect x="60" y="770" width="1320" height="170" rx="12" fill="#fff7e9" stroke="#e8d6b8" stroke-width="2"/>
<text x="80" y="804" font-size="21" fill="#a87024" text-anchor="start">区分三种 Trace：样本来源的历史 Trace、本次被评应用 Trace、裁判自己的执行 Trace。</text>
<text x="80" y="835" font-size="21" fill="#a87024" text-anchor="start">一个 Run 可以包含多条样本；同一目标可以有多个指标的 Score。</text>
<text x="80" y="866" font-size="21" fill="#a87024" text-anchor="start">Score 的目标不等于裁判 executionTraceId，不能按分数名称或时间接近程度认领。</text>
<text x="48" y="1028" font-size="17" fill="#5b7280" text-anchor="start">此图说明对象职责与关联，不表示评分必须等待整棵 Trace 全部完成。</text>
</svg>