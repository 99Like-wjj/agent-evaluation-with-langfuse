<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1280" viewBox="0 0 1440 1280" role="img"><title>从项目数据到裁判实际收到的内容</title><desc>以抽查的既有评测记录说明五类输入；不展示业务原文。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","Segoe UI",sans-serif}</style>
<defs><marker id="a0" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#356eb2"/></marker><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#167f7d"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a87024"/></marker><marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#775a9c"/></marker><marker id="a4" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#203848"/></marker><marker id="a5" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#5b7280"/></marker></defs>
<rect width="1440" height="1280" fill="#fbfcfc"/>
<text x="48" y="66" font-size="34" fill="#203848" text-anchor="start" font-weight="700">从项目数据到裁判实际收到的内容</text>
<text x="48" y="110" font-size="21" fill="#5b7280" text-anchor="start">以抽查的既有评测记录说明五类输入；不展示业务原文。</text>
<rect x="1240" y="36" width="150" height="40" rx="20" fill="#edf2f4" stroke="none" stroke-width="2"/>
<text x="1315" y="64" font-size="19" fill="#5b7280" text-anchor="middle">实际取数</text>
<line x1="48" x2="1392" y1="144" y2="144" stroke="#dce5e9"/>
<rect x="60" y="200" width="470" height="140" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="84" y="244" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">input</text>
<text x="84" y="284" font-size="22" fill="#203848" text-anchor="start">原问题</text>
<text x="84" y="316" font-size="22" fill="#203848" text-anchor="start">应用与入口上下文</text>
<polyline points="530,270 575,270" fill="none" stroke="#356eb2" stroke-width="2.8" marker-end="url(#a0)" stroke-linejoin="round"/>
<rect x="60" y="365" width="470" height="140" rx="15" fill="#fff" stroke="#356eb2" stroke-width="2"/>
<text x="84" y="409" font-size="25" fill="#356eb2" text-anchor="start" font-weight="700">expected_output</text>
<text x="84" y="449" font-size="22" fill="#203848" text-anchor="start">参考内容</text>
<text x="84" y="481" font-size="22" fill="#203848" text-anchor="start">参考来源</text>
<polyline points="530,435 575,435" fill="none" stroke="#356eb2" stroke-width="2.8" marker-end="url(#a0)" stroke-linejoin="round"/>
<rect x="60" y="530" width="470" height="140" rx="15" fill="#fff" stroke="#167f7d" stroke-width="2"/>
<text x="84" y="574" font-size="25" fill="#167f7d" text-anchor="start" font-weight="700">output</text>
<text x="84" y="614" font-size="22" fill="#203848" text-anchor="start">回答、完成态与错误</text>
<text x="84" y="646" font-size="22" fill="#203848" text-anchor="start">工具摘要及部分参数/结果事实</text>
<polyline points="530,600 575,600" fill="none" stroke="#167f7d" stroke-width="2.8" marker-end="url(#a1)" stroke-linejoin="round"/>
<rect x="60" y="695" width="470" height="140" rx="15" fill="#fff" stroke="#167f7d" stroke-width="2"/>
<text x="84" y="739" font-size="25" fill="#167f7d" text-anchor="start" font-weight="700">tool_calls</text>
<text x="84" y="779" font-size="22" fill="#203848" text-anchor="start">标准工具调用结构</text>
<text x="84" y="811" font-size="22" fill="#203848" text-anchor="start">抽查中 arguments 为空对象</text>
<polyline points="530,765 575,765" fill="none" stroke="#167f7d" stroke-width="2.8" marker-end="url(#a1)" stroke-linejoin="round"/>
<rect x="60" y="860" width="470" height="140" rx="15" fill="#fff" stroke="#a87024" stroke-width="2"/>
<text x="84" y="904" font-size="25" fill="#a87024" text-anchor="start" font-weight="700">experiment_item_metadata</text>
<text x="84" y="944" font-size="22" fill="#203848" text-anchor="start">用例标识与场景上下文</text>
<text x="84" y="976" font-size="22" fill="#203848" text-anchor="start">个别裁判输入中此变量为空</text>
<polyline points="530,930 575,930" fill="none" stroke="#a87024" stroke-width="2.8" marker-end="url(#a2)" stroke-linejoin="round"/>
<line x1="575" x2="575" y1="270" y2="930" stroke="#5b7280" stroke-width="2.8"/>
<rect x="635" y="475" width="320" height="250" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="659" y="519" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">Rule + Evaluator</text>
<text x="659" y="559" font-size="22" fill="#203848" text-anchor="start">检查规则覆盖</text>
<text x="659" y="591" font-size="22" fill="#203848" text-anchor="start">核对来源与 JSONPath</text>
<text x="659" y="623" font-size="22" fill="#203848" text-anchor="start">变量名不决定来源</text>
<polyline points="575,600 635,600" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<rect x="1035" y="475" width="345" height="250" rx="15" fill="#fff" stroke="#775a9c" stroke-width="2"/>
<text x="1059" y="519" font-size="25" fill="#775a9c" text-anchor="start" font-weight="700">渲染后的裁判消息</text>
<text x="1059" y="559" font-size="22" fill="#203848" text-anchor="start">提示词 + 映射后的数据</text>
<text x="1059" y="591" font-size="22" fill="#203848" text-anchor="start">与既有执行记录对应</text>
<text x="1059" y="623" font-size="22" fill="#203848" text-anchor="start">交给绑定的评估模型</text>
<polyline points="955,600 1035,600" fill="none" stroke="#775a9c" stroke-width="2.8" marker-end="url(#a3)" stroke-linejoin="round"/>
<rect x="60" y="1080" width="1320" height="125" rx="12" fill="#fff7e9" stroke="#e8d6b8" stroke-width="2"/>
<text x="80" y="1114" font-size="21" fill="#a87024" text-anchor="start">标准 tool_calls 与 output 中的工具摘要不同，都不能默认视为完整工具结果。</text>
<text x="80" y="1145" font-size="21" fill="#a87024" text-anchor="start">裁判可用哪些材料，取决于本次目标数据、实际映射与渲染；材料不足需由规则明确处理。</text>
<text x="80" y="1176" font-size="21" fill="#a87024" text-anchor="start">这张图不表示平台会自动遍历同一 Trace 的所有节点。</text>
<text x="48" y="1258" font-size="17" fill="#5b7280" text-anchor="start">当前 observation/experiment 路径按目标字段取数；旧 trace/dataset 映射另有机制。</text>
</svg>